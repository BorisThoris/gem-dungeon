name: Dungeon scheduled stress

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seed_count:
        description: Seeds per floor cohort
        default: "250"
        required: true
        type: string

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        floors: [1, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEED_COUNT: ${{ inputs.seed_count || '250' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: 22
      - run: yarn install --frozen-lockfile
      - name: Deterministic stress sweep
        run: >-
          yarn tsx scripts/dungeon-seed-sweep.ts
          --count "$SEED_COUNT"
          --floors "${{ matrix.floors }}"
          --prefix "scheduled-f${{ matrix.floors }}"
          --output "artifacts/dungeon-stress-f${{ matrix.floors }}.json"
      - name: Expressive-range sample
        run: >-
          yarn tsx scripts/dungeon-expressive-range.ts
          --count 100
          --floors "${{ matrix.floors }}"
          --output "artifacts/dungeon-expressive-range-f${{ matrix.floors }}.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: dungeon-stress-f${{ matrix.floors }}
          path: artifacts/*.json
          retention-days: 30
